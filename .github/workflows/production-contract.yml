name: Offline production contract checks
on:
  pull_request:
    paths: ['scripts/**', 'tests/**', 'specs/**', '.github/workflows/production-contract.yml']
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'specs/**', '.github/workflows/production-contract.yml']
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python3 -m unittest discover -s tests -v
